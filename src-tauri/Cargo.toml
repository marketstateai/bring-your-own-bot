[package]
name = "orama-codex-connector"
version = "0.1.0"
description = "Local Codex connector for MarketState Orama"
authors = ["MarketState"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.10.3", features = ["tray-icon"] }
uuid = { version = "1.22", features = ["v4"] }
